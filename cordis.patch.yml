- insert:
    - id: medical-anonymizer
      name: 'dsh-medical-anonymizer'
      config:
        baseURL: 'http://127.0.0.1:11434/v1'
        model: ''
        # Optional independent verification model; empty = the model above.
        verifyBaseURL: ''
        verifyModel: ''
        outputRoot: ''
        maxRounds: 3
        # Text files per chunk; larger inputs are split into chunks automatically.
        maxFiles: 200
        # Files processed at the same time. Model calls are never capped.
        concurrency: 4
        # Let each model's concurrency follow its measured throughput, starting
        # from the value above (and verifyConcurrency for the verifier).
        autoConcurrency: true
        # DICOM files (header only, no model calls) have their own cap.
        maxDicomFiles: 50000
        disableThinking: true
        showSidebarEntry: true
        # Content that cannot be read as text (images, PDFs, binary, unknown
        # encodings): review (default, hold for a human) | remove (placeholder).
        opaquePolicy: review
        # Images (PNG, JPEG, GIF, BMP, TIFF) are replaced with a placeholder without
        # review; other unreadable content follows opaquePolicy. Set false to review them.
        removeImages: true
        # Write values stored as base64 / hex (and the compression or EMR document
        # container inside) as the text they hold. Set false to keep the original encoding.
        unwrapEncoded: true
        # Send embedded images under review to the detection model to sort them
        # (signature, seal, chart …) and suggest remove / keep. The images are
        # sent to the model endpoint; needs a vision model. Set false to turn off.
        imageCheck: true
        # Anonymization rules. Defaults: every identifier -> stable pseudonym;
        # quasi-identifiers untouched. Strategies:
        #   identifiers: pseudonym | mask | redact | keep
        #   date: keep | shift | month | year | redact
        #   age: keep | band10 | band5 | redact
        #   sex: keep | redact
        #   postalCode: keep | prefix3 | redact
        identifierPolicy:
          name: pseudonym
          doctor: pseudonym
          idCard: pseudonym
          phone: pseudonym
          email: pseudonym
          address: pseudonym
          mrn: pseudonym
          admission: pseudonym
          visit: pseudonym
          socialSecurity: pseudonym
          bankCard: pseudonym
          hospital: pseudonym
        quasiIdentifiers: false
        quasiPolicy:
          date: shift
          age: band10
          sex: keep
          postalCode: prefix3
        # False-positive exclusions, one item each. allowValues are never
        # treated as identifiers (and are removed from the vault on the next
        # run); skipFields are column/JSON key names copied as-is.
        allowValues: []
        skipFields: []
        # Values always replaced, "类型:值" per item (e.g. 姓名:张三).
        forceValues: []
        # Effect assessment in the report: A = K × S × E, met when A >= 1.
        # Scenario (S):
        #   enclaveSame 1/3 | enclaveCross 1/4 | controlledTwo 1/5 |
        #   controlledMulti 1/6 | public 1/20
        # Environment coefficient E: 0.1–10, typical 1. Column names to leave
        # out of / add to the quasi-identifiers used for K.
        assessScene: controlledTwo
        assessEnvironment: 1
        assessIgnoreFields: []
        assessExtraFields: []
        # Basis named in the reports (one line); empty = the national
        # standards GB/T 37964—2019 and GB/T 42460—2023.
        assessBasis: ''

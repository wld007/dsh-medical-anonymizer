- insert:
    - id: medical-anonymizer
      name: 'dsh-medical-anonymizer'
      config:
        baseURL: 'http://127.0.0.1:11434/v1'
        model: ''
        # Optional independent verification model; empty = the model above.
        verifyBaseURL: ''
        verifyModel: ''
        outputRoot: ''
        maxRounds: 3
        # Text files per chunk; larger inputs are split into chunks automatically.
        maxFiles: 200
        # Files processed at the same time. Model calls are never capped.
        concurrency: 4
        # DICOM files (header only, no model calls) have their own cap.
        maxDicomFiles: 50000
        disableThinking: true
        showSidebarEntry: true
        # Content that cannot be read as text (images, PDFs, binary, unknown
        # encodings): review (default, hold for a human) | remove (placeholder).
        opaquePolicy: review
        # Anonymization rules. Defaults: every identifier -> stable pseudonym;
        # quasi-identifiers untouched. Strategies:
        #   identifiers: pseudonym | mask | redact | keep
        #   date: keep | shift | month | year | redact
        #   age: keep | band10 | band5 | redact
        #   sex: keep | redact
        #   postalCode: keep | prefix3 | redact
        identifierPolicy:
          name: pseudonym
          doctor: pseudonym
          idCard: pseudonym
          phone: pseudonym
          email: pseudonym
          address: pseudonym
          mrn: pseudonym
          admission: pseudonym
          visit: pseudonym
          socialSecurity: pseudonym
          bankCard: pseudonym
          hospital: pseudonym
        quasiIdentifiers: false
        quasiPolicy:
          date: shift
          age: band10
          sex: keep
          postalCode: prefix3
        # False-positive exclusions, one item each. allowValues are never
        # treated as identifiers (and are removed from the vault on the next
        # run); skipFields are column/JSON key names copied as-is.
        allowValues: []
        skipFields: []
